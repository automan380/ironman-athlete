<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Ironman Planner</title>
</head>
<body>
  <header id="topbar" hidden>
    <button id="menu" class="iconbtn" aria-label="Menu">☰</button>
    <button id="back" class="iconbtn" hidden aria-label="Back">‹</button>
    <a class="logo" id="brand" aria-label="Ironman Planner">
      <img class="logomark" src="icons/logo.png" width="27" height="27" alt="" aria-hidden="true">
      <span class="wordmark"></span>
    </a>
    <div class="spacer"></div>
    <span id="sync" class="sync"></span>
  </header>
  <div id="backdrop" class="backdrop" hidden></div>
  <nav id="drawer" class="drawer" hidden></nav>
  <main id="app" aria-live="polite"></main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
