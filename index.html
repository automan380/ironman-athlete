<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f7b8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Training</title>
</head>
<body>
  <header id="topbar" hidden>
    <button id="back" class="iconbtn" hidden aria-label="Back">‹</button>
    <a class="logo" id="brand" aria-label="Training">
      <svg class="logomark" width="27" height="27" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#c8102e"/>
        <rect x="12" y="30.5" width="24" height="5.5" rx="2.75" fill="#fff"/>
        <rect x="12" y="21.25" width="18" height="5.5" rx="2.75" fill="#fff"/>
        <rect x="12" y="12" width="21" height="5.5" rx="2.75" fill="#fff"/>
      </svg>
      <span class="wordmark"></span>
    </a>
    <div class="spacer"></div>
    <span id="sync" class="sync"></span>
    <button id="gear" class="iconbtn" aria-label="Settings">⚙</button>
  </header>
  <div id="settingspanel" class="settingspanel" hidden></div>
  <main id="app" aria-live="polite"></main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
